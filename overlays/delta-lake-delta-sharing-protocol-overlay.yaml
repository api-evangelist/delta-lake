  note: >-
    Non-destructive enhancements only. The original specification is left byte-for-byte as
    published in https://github.com/delta-io/delta-sharing/blob/main/delta-sharing-protocl-api-description.yml
    (note the typo in the upstream filename). Every action below is either a correction the
