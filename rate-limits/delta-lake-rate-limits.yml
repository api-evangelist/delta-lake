description: >-
  The Delta Sharing protocol publishes no rate limits. Neither the normative PROTOCOL.md nor
  the first-party OpenAPI defines a 429 response, a Retry-After header, or any RateLimit-* or
  X-RateLimit-* response header. This is structural rather than an omission: Delta Sharing is a
  self-hosted protocol, so throttling is a property of whoever operates a given sharing server,
  not of the specification.
