note: >-
  This file previously carried scaffold per-tier limits and X-RateLimit-* headers written by
  the 2026-05-04 bulk sweep. Those values were never published by Delta Lake and were removed on
  2026-09-05. An agent calling a Delta Sharing server gets no runtime throttling signal at all:
  there is no header to read and no defined exhaustion status, so back off on 5xx and pace
  conservatively. Recorded as an honest zero.
pagination_note: >-
  The only volume control the protocol defines is pagination — maxResults / pageToken with a
  nextPageToken response field, and a limitHint in the QueryTable body. See
  conventions/delta-lake-conventions.yml.
