description: >-
  Delta Lake publishes no plans and no pricing, and none would apply. It is an Apache-2.0
  open source storage framework and an open REST protocol governed by LF Projects, LLC —
  software you run yourself, not a metered hosted service. There is no signup, no billing
  relationship and no quota to sell. The only endpoint the project operates,
  https://sharing.delta.io/delta-sharing/, is a free public demo sharing server with an
  openly published bearer token (see sandbox/delta-lake-sandbox.yml).
