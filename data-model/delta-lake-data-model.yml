gaps:
  - >-
    Three of the twelve component schemas (TableMetadataResponse, TableQueryResponse,
    ChangeDataFeedResponse) are typed as bare strings. The response bodies that carry all the
    actual data are therefore invisible to any generated client, and a consumer must read
    PROTOCOL.md to parse them. This is the largest contract-quality gap in the spec.
  - >-
    No id-prefix scheme exists. Every relationship is a name reference, so a client cannot
    tell a share name from a schema name out of context.
