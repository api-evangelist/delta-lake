description: >-
  The Delta Sharing entity graph is a three-level namespace — share, schema, table — with
  each level addressed by name rather than by an opaque id. Names are case-insensitive and
  are the join key; the only id in the model is Share.id, which is optional. Table content is
  not modelled as entities: query responses are newline-delimited JSON action objects
  (protocol, metaData, file/add/cdf/remove, endStreamAction) carried as opaque strings in the
  OpenAPI, with their real shapes defined in PROTOCOL.md.
