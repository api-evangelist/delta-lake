entries:
  - version: 4.4.0
    date: '2026-08-20'
    breaking: false
    highlights:
      - Apache Spark 4.2.0 support across Delta Spark, Delta Connect and Delta Sharing.
      - >-
        Delta Kernel and the experimental Flink connector can use the UC Delta API for
        catalog-managed tables.
      - CREATE TABLE supports GENERATED ALWAYS AS IDENTITY and GENERATED BY DEFAULT AS IDENTITY.
      - Generated columns are supported on tables created through Unity Catalog.
  - version: 3.3.3
    date: '2026-08-12'
    breaking: false
    highlights:
      - >-
        This patch release does not publish delta-iceberg (UniForm/Iceberg support) — a module
        withdrawn from the maintenance line.
      - Fixed transaction-log retention during metadata cleanup that could delete still-needed log files.
      - Fixed a Delta Sharing deletion-vector cache refresh bug affecting long-running queries.
      - Upgraded delta-sharing-client 1.2.2 to 1.2.8 for OAuth token parsing and retry behaviour.
  - version: 4.3.1
    date: '2026-07-08'
    breaking: false
    highlights:
      - Fixed an OAuth case-sensitivity bug in Delta REST Catalog authentication.
      - Published Maven artifacts for Spark 4.1.0.
  - version: 4.3.0
    date: '2026-06-18'
    breaking: false
    highlights:
      - Unity Catalog Delta REST API integration in Spark.
      - Selective data replacement via the replaceOn and replaceUsing DataFrame APIs.
      - UniForm writes Iceberg metadata atomically with the Delta commit, incrementally.
      - Delta Sharing streaming and change-data-feed support improved in Spark.
  - version: 4.2.0
    date: '2026-04-16'
    breaking: false
    highlights:
      - Unity Catalog managed table enhancements — REPLACE TABLE / RTAS, dynamic partition overwrite (experimental).
      - New Kernel-based delta-flink connector (experimental).
      - Delta Kernel reads and writes geometry/geography types; Variant GA; collations table feature.
      - A substantial security hardening effort across validation and dependencies.
  - version: 4.1.0
    date: '2026-02-26'
    breaking: false
    highlights:
      - Apache Spark 4.1.0 support with retained 4.0.x compatibility.
      - Catalog-managed table enhancements (preview).
      - New Spark DataSource V2 connector backed by the Delta Kernel API.
      - >-
        Server-side planning (preview) — scan planning delegated to catalog servers following
        the Apache Iceberg REST Catalog API.
      - Conflict-free enablement of deletion vectors and column mapping on existing tables.
